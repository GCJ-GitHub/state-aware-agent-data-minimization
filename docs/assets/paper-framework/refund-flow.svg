<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif"><title>refund-flow</title><defs><marker id="arr-cyan" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#36A4B8"/></marker><marker id="arr-purple" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#9C86D0"/></marker><marker id="arr-red" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#DC8F88"/></marker><marker id="arr-gray" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#B5BFCD"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="55" y="54" text-anchor="start" font-size="30" font-weight="600" fill="#172B44">关键例子：银行仍可用，为什么账户字段却不能再读？</text><text x="55" y="87" text-anchor="start" font-size="18" font-weight="400" fill="#617087">机制示例（非新增实验）｜读取理由随状态变化；平台不替 Agent 生成调用。</text><rect x="30" y="110" width="1540" height="635" rx="20" fill="white" stroke="#CCD5DF" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="70" y="132" width="1430" height="61" rx="12" fill="#F8FAFC" stroke="#CCD5DF" stroke-width="1.6"/><text x="785" y="171" text-anchor="middle" font-size="22" font-weight="600" fill="#172B44">用户：优先钱包退款；不可用时再走银行。只使用当前必要的资料。</text><rect x="70" y="240" width="430" height="115" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="285.0" y="294.5" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">1  钱包暂不可用</text><text x="285.0" y="326.5" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">选择银行计划，符合当前用户偏好</text><rect x="570" y="240" width="430" height="115" rx="14" fill="#F3F0FC" stroke="#9C86D0" stroke-width="1.6"/><text x="785.0" y="294.5" text-anchor="middle" font-size="24" font-weight="600" fill="#5E4593">2  Agent 申请银行字段</text><text x="785.0" y="326.5" text-anchor="middle" font-size="18" font-weight="400" fill="#5E4593">account_ref + owner_ref（尚未交付）</text><rect x="1070" y="240" width="430" height="115" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="1285.0" y="294.5" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">3  取数前，钱包恢复</text><text x="1285.0" y="326.5" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">银行仍可用，但不再是用户首选</text><rect x="1070" y="475" width="430" height="115" rx="14" fill="#FFF3F2" stroke="#DC8F88" stroke-width="1.6"/><text x="1285.0" y="529.5" text-anchor="middle" font-size="24" font-weight="600" fill="#A64C46">4  平台拒绝旧取数理由</text><text x="1285.0" y="561.5" text-anchor="middle" font-size="18" font-weight="400" fill="#A64C46">不交付银行字段，反馈状态已变化</text><rect x="570" y="475" width="430" height="115" rx="14" fill="#F3F0FC" stroke="#9C86D0" stroke-width="1.6"/><text x="785.0" y="529.5" text-anchor="middle" font-size="24" font-weight="600" fill="#5E4593">5  Agent 自己重选</text><text x="785.0" y="561.5" text-anchor="middle" font-size="18" font-weight="400" fill="#5E4593">刷新状态，提出钱包计划并取数</text><rect x="70" y="475" width="430" height="115" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="285.0" y="529.5" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">6  按新计划完成退款</text><text x="285.0" y="561.5" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">只读 wallet_ref，再调用钱包工具</text><path d="M 500,297 L 570,297" fill="none" stroke="#9C86D0" stroke-width="2.2" marker-end="url(#arr-purple)"/><path d="M 1000,297 L 1070,297" fill="none" stroke="#36A4B8" stroke-width="2.2" marker-end="url(#arr-cyan)"/><path d="M 1285,355 L 1285,475" fill="none" stroke="#DC8F88" stroke-width="2.2" marker-end="url(#arr-red)"/><text x="1305" y="421" text-anchor="start" font-size="17" font-weight="400" fill="#A64C46">交付前重验证</text><path d="M 1070,532 L 1000,532" fill="none" stroke="#DC8F88" stroke-width="2.2" marker-end="url(#arr-red)"/><path d="M 570,532 L 500,532" fill="none" stroke="#9C86D0" stroke-width="2.2" marker-end="url(#arr-purple)"/><rect x="70" y="645" width="1430" height="67" rx="12" fill="#F8FAFC" stroke="#CCD5DF" stroke-width="1.6"/><text x="785" y="684" text-anchor="middle" font-size="21" font-weight="600" fill="#172B44">关键：授权范围没变，但当前取数理由变了；检查应发生在原值出库前。</text></svg>