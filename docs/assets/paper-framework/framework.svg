<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000" font-family="Hiragino Sans GB, PingFang SC, Noto Sans CJK SC, sans-serif"><title>framework</title><defs><marker id="arr-cyan" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#36A4B8"/></marker><marker id="arr-purple" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#9C86D0"/></marker><marker id="arr-red" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#DC8F88"/></marker><marker id="arr-gray" viewBox="0 0 12 10" refX="11.5" refY="5" markerWidth="8" markerHeight="7" orient="auto"><path d="M0,0 L12,5 L0,10 Z" fill="#B5BFCD"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="55" y="54" text-anchor="start" font-size="30" font-weight="600" fill="#172B44">状态感知数据最小化：从“任务相关”到“此刻必要”</text><text x="55" y="87" text-anchor="start" font-size="18" font-weight="400" fill="#617087">方法总览｜Agent 决定怎么做；平台验证此刻能读什么，并在拒绝后支持继续执行。</text><rect x="25" y="110" width="1590" height="860" rx="20" fill="white" stroke="#CCD5DF" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="520" y="315" width="1080" height="520" rx="20" fill="white" stroke="#7ABCC7" stroke-width="1.6" stroke-dasharray="7 5"/><text x="550" y="309" text-anchor="start" font-size="20" font-weight="600" fill="#176D80">可信平台</text><rect x="60" y="130" width="390" height="95" rx="14" fill="#F3F0FC" stroke="#9C86D0" stroke-width="1.6"/><text x="255.0" y="174.5" text-anchor="middle" font-size="24" font-weight="600" fill="#5E4593">用户目标与授权</text><text x="255.0" y="206.5" text-anchor="middle" font-size="18" font-weight="400" fill="#5E4593">目标、偏好、可用数据边界</text><rect x="550" y="130" width="500" height="95" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="800.0" y="174.5" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">工具契约与依赖</text><text x="800.0" y="206.5" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">登记输入、前置条件与产物</text><rect x="1180" y="130" width="360" height="95" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="1360.0" y="174.5" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">可信业务状态</text><text x="1360.0" y="206.5" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">来源可核验，状态有版本</text><rect x="550" y="335" width="500" height="110" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="800.0" y="387.0" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">C1  推导当前的数据需求</text><text x="800.0" y="419.0" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">目标 × 合法计划 × 可信状态 × 证据版本</text><rect x="60" y="495" width="390" height="130" rx="14" fill="#F3F0FC" stroke="#9C86D0" stroke-width="1.6"/><text x="255.0" y="557.0" text-anchor="middle" font-size="24" font-weight="600" fill="#5E4593">LLM Agent</text><text x="255.0" y="589.0" text-anchor="middle" font-size="18" font-weight="400" fill="#5E4593">理解任务 · 提出计划 · 自主调用</text><rect x="550" y="495" width="500" height="130" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="800.0" y="557.0" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">C2  强制校验与最小放行</text><text x="800.0" y="589.0" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">只放行当前步骤尚缺且理由有效的数据</text><rect x="1180" y="495" width="360" height="130" rx="14" fill="#EEFAFD" stroke="#36A4B8" stroke-width="1.6"/><text x="1360.0" y="557.0" text-anchor="middle" font-size="24" font-weight="600" fill="#176D80">业务工具与私有数据</text><text x="1360.0" y="589.0" text-anchor="middle" font-size="18" font-weight="400" fill="#176D80">原值只经受控接口交付</text><rect x="550" y="700" width="500" height="115" rx="14" fill="#FFF3F2" stroke="#DC8F88" stroke-width="1.6"/><text x="800.0" y="754.5" text-anchor="middle" font-size="24" font-weight="600" fill="#A64C46">C3  可恢复反馈与自主重试</text><text x="800.0" y="786.5" text-anchor="middle" font-size="18" font-weight="400" fill="#A64C46">返回原因与下一步选项，由 Agent 自己继续</text><rect x="60" y="865" width="1480" height="80" rx="14" fill="#F8FAFC" stroke="#B5BFCD" stroke-width="1.6" stroke-dasharray="7 5"/><text x="800.0" y="902.0" text-anchor="middle" font-size="24" font-weight="600" fill="#67758A">扩展方向：通用粒度控制 · 接收方约束 · 输出控制</text><text x="800.0" y="934.0" text-anchor="middle" font-size="18" font-weight="400" fill="#67758A">灰色虚线模块尚未通用化；已交付原值不能撤回，当前不承诺端到端零泄露</text><path d="M 255,225 L 255,495" fill="none" stroke="#9C86D0" stroke-width="2.2" marker-end="url(#arr-purple)"/><text x="275" y="372" text-anchor="start" font-size="17" font-weight="400" fill="#5E4593">原始任务</text><path d="M 450,178 L 490,178 L 490,388 L 550,388" fill="none" stroke="#9C86D0" stroke-width="2.2" marker-end="url(#arr-purple)"/><path d="M 800,225 L 800,335" fill="none" stroke="#36A4B8" stroke-width="2.2" marker-end="url(#arr-cyan)"/><path d="M 1360,225 L 1360,280 L 950,280 L 950,335" fill="none" stroke="#36A4B8" stroke-width="2.2" marker-end="url(#arr-cyan)"/><path d="M 800,445 L 800,495" fill="none" stroke="#36A4B8" stroke-width="2.2" marker-end="url(#arr-cyan)"/><path d="M 450,535 L 550,535" fill="none" stroke="#9C86D0" stroke-width="2.2" marker-end="url(#arr-purple)"/><text x="485" y="520" text-anchor="middle" font-size="15" font-weight="400" fill="#5E4593">工具请求</text><path d="M 550,585 L 450,585" fill="none" stroke="#36A4B8" stroke-width="2.2" marker-end="url(#arr-cyan)"/><text x="485" y="612" text-anchor="middle" font-size="15" font-weight="400" fill="#176D80">受控回包</text><path d="M 1050,535 L 1180,535" fill="none" stroke="#36A4B8" stroke-width="2.2" marker-end="url(#arr-cyan)"/><text x="1115" y="520" text-anchor="middle" font-size="15" font-weight="400" fill="#176D80">允许读取 / 执行</text><path d="M 1180,585 L 1050,585" fill="none" stroke="#36A4B8" stroke-width="2.2" marker-end="url(#arr-cyan)"/><text x="1115" y="612" text-anchor="middle" font-size="15" font-weight="400" fill="#176D80">值、判断或结果</text><path d="M 800,625 L 800,700" fill="none" stroke="#DC8F88" stroke-width="2.2" marker-end="url(#arr-red)"/><text x="823" y="667" text-anchor="start" font-size="17" font-weight="400" fill="#A64C46">失效 / 缺证据</text><path d="M 550,757 L 340,757 L 340,625" fill="none" stroke="#DC8F88" stroke-width="2.2" marker-end="url(#arr-red)"/><text x="310" y="787" text-anchor="middle" font-size="17" font-weight="400" fill="#A64C46">恢复不扩大授权</text><path d="M 1360,625 L 1360,665 L 1570,665 L 1570,178 L 1540,178" fill="none" stroke="#36A4B8" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#arr-cyan)"/><text x="1193" y="696" text-anchor="start" font-size="17" font-weight="400" fill="#176D80">状态事件 / 执行结果</text></svg>